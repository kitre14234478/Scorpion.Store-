<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العقرب | Scorpion Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0F19; color: #F3F4F6; }
        .gold-accent { color: #D4AF37; }
        .bg-card { background-color: #131B2E; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="text-center mb-10">
        <h1 class="text-3xl font-bold gold-accent mb-2">متجر العقرب 🦂</h1>
        <p class="text-sm text-gray-400">أحدث المنتجات والعروض المميزة</p>
    </header>

    <main id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
        <div class="text-center col-span-full py-10 text-gray-400">جاري تحميل المنتجات...</div>
    </main>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwVNrMkr3gEIbNqom4SFharHfCq7V98oWSr1o7Lb-AREwh0QvKn777AcRMadkuedtrh/exec';

        function formatMedia(url) {
            if (!url) return '';
            url = String(url).trim();

            // 1. دعم يوتيوب (عادي أو Shorts)
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                } else if (url.includes('shorts/')) {
                    videoId = url.split('shorts/')[1].split('?')[0];
                }
                if (videoId) {
                    return `<iframe class="w-full h-56 rounded-xl" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                }
            }

            // 2. دعم تيك توك
            if (url.includes('tiktok.com')) {
                const match = url.match(/video\/(\d+)/);
                if (match && match[1]) {
                    return `<iframe class="w-full h-80 rounded-xl" src="https://www.tiktok.com/embed/v2/${match[1]}" frameborder="0" allowfullscreen></iframe>`;
                }
                return `<div class="h-48 bg-gray-900 rounded-xl flex items-center justify-center"><a href="${url}" target="_blank" class="text-[#38BDF8] font-bold underline">مشاهدة الفيديو على تيك توك 🎬</a></div>`;
            }

            // 3. دعم إنستغرام
            if (url.includes('instagram.com')) {
                let cleanUrl = url.split('?')[0];
                if (!cleanUrl.endsWith('/')) cleanUrl += '/';
                return `<iframe class="w-full h-80 rounded-xl bg-white" src="${cleanUrl}embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>`;
            }

            // 4. الصور المباشرة
            return `<img src="${url}" alt="صورة المنتج" class="w-full h-56 object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/400x300/131B2E/D4AF37?text=Scorpion+Store'">`;
        }

        async function loadProducts() {
            const container = document.getElementById('products-container');
            try {
                const response = await fetch(scriptURL);
                const products = await response.json();

                if (!products || products.length === 0) {
                    container.innerHTML = '<div class="text-center col-span-full py-10 text-gray-400">لا توجد منتجات مضافة حالياً. أضف أول منتج من صفحة الإدارة!</div>';
                    return;
                }

                container.innerHTML = '';
                products.reverse().forEach(p => {
                    const card = `
                        <div class="bg-card border border-gray-800 rounded-2xl p-4 shadow-xl flex flex-col justify-between">
                            <div>
                                ${formatMedia(p.media)}
                                <h2 class="text-lg font-bold mt-4 text-white">${p.name}</h2>
                                <p class="text-sm text-gray-400 mt-1">${p.desc || ''}</p>
                            </div>
                            <div class="mt-4 pt-4 border-t border-gray-800 flex items-center justify-between">
                                <span class="gold-accent font-bold text-base">${p.price}</span>
                                <a href="${p.wa}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">اطلب عبر الواتساب</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                container.innerHTML = '<div class="text-center col-span-full py-10 text-red-400">تعذر الاتصال بجدول البيانات. تأكد أن صلاحية السكربت مضبوطة على "أي شخص".</div>';
            }
        }

        loadProducts();
    </script>
</body>
</html>
