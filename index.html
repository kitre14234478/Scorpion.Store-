<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العقرب | Scorpion Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0F19; color: #F3F4F6; }
        .gold-accent { color: #D4AF37; }
        .bg-card { background-color: #131B2E; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- الهيدر أو ترويسة المتجر -->
    <header class="text-center mb-10">
        <h1 class="text-3xl font-bold gold-accent mb-2">متجر العقرب 🦂</h1>
        <p class="text-sm text-gray-400">أحدث المنتجات والعروض المميزة</p>
    </header>

    <!-- حاوية عرض المنتجات القادمة من جوجل شيت -->
    <main id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
        <div class="text-center col-span-full py-10 text-gray-400">جاري تحميل المنتجات...</div>
    </main>

    <script>
        // ضع هنا رابط جلب البيانات من الجداول أو السكربت الخاص بك (أو رابط النشر لجوجل شيت بصيغة JSON)
        // ملاحظة: يمكنك وضع رابط الـ Web App الخاص بك هنا ليجلب المنتجات مباشرة
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFWSe8tSlSieYPjbENZ0gSRgcSZ3l9rnEq83RZDiZ11X-EVgx4lGXefrwEjknS-9dPog/exec';

        async function loadProducts() {
            try {
                // ملاحظة: إذا كان السكربت مخصصاً للاستقبال فقط (POST)، سنحتاج لجعله يقرأ البيانات (GET)، 
                // أو يمكنك جلب البيانات عبر ربط صفحة الويب مباشرة بالنشر العام لجدول البيانات.
                // سنقوم هنا بعرض هيكلية الكود الذكي لتنسيق الوسائط (يوتيوب، تيك توك، صور):
            } catch (e) {
                console.log('Error loading products');
            }
        }

        // دالة ذكية لتحويل الروابط العادية إلى مشغلات فيديو أو صور تلقائياً
        function renderMedia(url) {
            if (!url) return '';
            
            // فحص يوتيوب
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                }
                if (videoId) {
                    return `<iframe class="w-full h-48 rounded-lg" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
                }
            }
            
            // فحص تيك توك
            if (url.includes('tiktok.com')) {
                return `<div class="p-4 bg-gray-900 rounded-lg text-center"><a href="${url}" target="_blank" class="text-[#38BDF8] underline text-sm">عرض فيديو تيك توك 🎬</a></div>`;
            }

            // الافتراضي: صورة مباشرة
            return `<img src="${url}" alt="منتج" class="w-full h-48 object-cover rounded-lg">`;
        }
    </main>
</body>
</html>
