<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العقرب | Scorpion Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0F19; color: #F3F4F6; }
        .gold-accent { color: #D4AF37; }
        .bg-card { background-color: #131B2E; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="text-center mb-10">
        <h1 class="text-3xl font-bold gold-accent mb-2">متجر العقرب 🦂</h1>
        <p class="text-sm text-gray-400">أحدث المنتجات والعروض المميزة</p>
    </header>

    <main id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
        <div class="text-center col-span-full py-10 text-gray-400">جاري تحميل المنتجات...</div>
    </main>

    <script>
        // رابط الويب الخاص بك لجلب البيانات (تم ضبطه ليقرا البيانات من الجدول)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxFWSe8tSlSieYPjbENZ0gSRgcSZ3l9rnEq83RZDiZ11X-EVgx4lGXefrwEjknS-9dPog/exec';

        async function fetchProducts() {
            const container = document.getElementById('products-container');
            try {
                // بما أن سكربت الإرسال يعمل بـ POST، سنجلب البيانات عبر رابط النشر العام أو محاكاة العرض
                // سنقوم بجلب البيانات عبر fetch 
                const response = await fetch(scriptURL);
                const products = await response.json();
                
                if (!products || products.length === 0) {
                    container.innerHTML = '<div class="text-center col-span-full py-10 text-gray-400">لا توجد منتجات مضافة حالياً.</div>';
                    return;
                }

                container.innerHTML = '';
                products.forEach(p => {
                    let mediaHTML = '';
                    const url = p.media || '';

                    // معالجة ذكية للوسائط (يوتيوب، تيك توك، أو صورة)
                    if (url.includes('youtube.com') || url.includes('youtu.be')) {
                        let videoId = url.includes('youtu.be/') ? url.split('youtu.be/')[1].split('?')[0] : url.split('watch?v=')[1]?.split('&')[0];
                        mediaHTML = videoId ? `<iframe class="w-full h-48 rounded-lg" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>` : `<a href="${url}" target="_blank" class="text-sky-400 underline block text-center py-10">عرض فيديو يوتيوب 🎬</a>`;
                    } else if (url.includes('tiktok.com')) {
                        mediaHTML = `<div class="p-4 bg-gray-900 rounded-lg text-center h-48 flex items-center justify-center"><a href="${url}" target="_blank" class="text-[#38BDF8] font-bold underline text-sm">عرض فيديو تيك توك 🎬</a></div>`;
                    } else {
                        mediaHTML = `<img src="${url}" alt="منتج" class="w-full h-48 object-cover rounded-lg">`;
                    }

                    const card = `
                        <div class="bg-card border border-gray-800 rounded-2xl p-4 shadow-xl flex flex-col justify-between">
                            <div>
                                ${mediaHTML}
                                <h2 class="text-lg font-bold mt-4 text-white">${p.name}</h2>
                                <p class="text-sm text-gray-400 mt-1">${p.desc || ''}</p>
                            </div>
                            <div class="mt-4 pt-4 border-t border-gray-800 flex items-center justify-between">
                                <span class="gold-accent font-bold text-base">${p.price}</span>
                                <a href="${p.wa}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">اطلب عبر الواتساب</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                // في حال كان الـ Web App مخصصاً للـ POST فقط، نعرض رسالة توجيهية أو نربطه بالشكل السليم
                container.innerHTML = '<div class="text-center col-span-full py-10 text-gray-400">أضف أول منتج عبر لوحة التحكم ليظهر هنا فوراً!</div>';
            }
        }

        fetchProducts();
    </script>
</body>
</html>
