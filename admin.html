<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العقرب | Scorpion Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0F19; color: #F3F4F6; }
        .gold-accent { color: #D4AF37; }
        .bg-card { background-color: #131B2E; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="text-center mb-10">
        <h1 class="text-3xl font-bold gold-accent mb-2">متجر العقرب 🦂</h1>
        <p class="text-sm text-gray-400">أحدث المنتجات والعروض المميزة</p>
    </header>

    <main id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
        <div class="text-center col-span-full py-10 text-gray-400">جاري تحميل المنتجات...</div>
    </main>

    <script>
        // سنقوم بجلب البيانات عبر الـ Web App بعد تعديل بسيط أو باستخدام النسخة التجريبية المباشرة
        // بما أن بياناتك وصلت للجدول بنجاح (كما في صورتك)، سنقوم بعرض المنتج التجريبي مباشرة:
        
        const container = document.getElementById('products-container');
        
        // عرض المنتج الذي أرسلته للتو بناءً على صورتك في الجدول:
        setTimeout(() => {
            container.innerHTML = `
                <div class="bg-card border border-gray-800 rounded-2xl p-4 shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="p-4 bg-gray-900 rounded-lg text-center h-48 flex items-center justify-center">
                            <a href="https://www.youtube.com/watch?v=..." target="_blank" class="text-[#38BDF8] font-bold underline text-sm">عرض فيديو / رابط المنتج 🎬</a>
                        </div>
                        <h2 class="text-lg font-bold mt-4 text-white">hussein</h2>
                        <p class="text-sm text-gray-400 mt-1">zxzcxzcv..1#13</p>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-800 flex items-center justify-between">
                        <span class="gold-accent font-bold text-base">20</span>
                        <a href="#" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">اطلب عبر الواتساب</a>
                    </div>
                </div>
            `;
        }, 500);
    </script>
</body>
</html>
